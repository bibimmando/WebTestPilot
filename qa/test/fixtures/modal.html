<!doctype html>
<meta charset="utf-8">
<title>주문</title>
<main>
  <h1>주문 요약</h1>
  <p id="total">결제 금액 20,000원</p>
  <button id="open">쿠폰 적용</button>
</main>
<dialog id="dlg">
  <h2>쿠폰</h2>
  <label>쿠폰 코드 <input id="code"></label>
  <button id="apply">확인</button>
  <button id="close">닫기</button>
</dialog>
<script>
  const dlg = document.getElementById('dlg');
  document.getElementById('open').onclick = () => dlg.showModal();
  document.getElementById('close').onclick = () => dlg.close();
  document.getElementById('apply').onclick = () => {
    if (document.getElementById('code').value === 'SAVE10') document.getElementById('total').textContent = '결제 금액 18,000원';
    dlg.close();
  };
</script>
