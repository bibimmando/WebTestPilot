[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wtp-preprocessor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["playwright>=1.45", "protego>=0.7"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
wtp-preprocessor = "wtp_preprocessor.cli:main"

[tool.setuptools.packages.find]
include = ["wtp_preprocessor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
