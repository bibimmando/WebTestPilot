name: Merge checks

on:
  pull_request:
    branches:
      - master

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Use Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install locked backend dependencies
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run isolated backend tests
        run: python -m pytest backend/tests -q

  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Both supported majors. jsdom 30 needs >= 22.22.2, so 22.x must
        # resolve to a recent 22 — see "engines" in package.json.
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Get version
        id: version
        run: echo "version=v$(./ci/getVersion.sh)" >> $GITHUB_OUTPUT

      - name: Verify version
        run: ./ci/verifyVersion.sh ${{ steps.version.outputs.version }}
