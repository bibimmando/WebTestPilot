name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    steps:
      - name: Check release source
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          if [ "$SOURCE_BRANCH" != "development" ] || [ "$SOURCE_REPO" != "$TARGET_REPO" ]; then
            echo "main PRs must come from this repository's development branch."
            exit 1
          fi

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: teams/member-01
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: python -m pip install -r integration/requirements.txt pytest
      - name: Install MCP server
        run: npm install --prefix .tools/playwright-mcp @playwright/mcp@0.0.83 --no-audit --no-fund
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Test preprocessor
        run: python -m pytest integration/tests/preprocessor -q
      - name: Test common form evidence
        run: python -m integration.test_form_evidence
      - name: Test integrated MCP flow
        run: python -m integration.test_integration
      - name: Test staged plan and judgment contracts
        run: python -m integration.test_staged
      - name: Test Claude planning skill boundaries
        run: python -m integration.test_skills
      - name: Test adaptive MCP execution agent
        run: python -m integration.test_executor
      - name: Test reset, links and cancellation
        run: python -m integration.test_regressions
