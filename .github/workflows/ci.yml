name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    steps:
      - name: Check release source
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          if [ "$SOURCE_BRANCH" != "development" ] || [ "$SOURCE_REPO" != "$TARGET_REPO" ]; then
            echo "main PRs must come from this repository's development branch."
            exit 1
          fi

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webtestpilot-crawler
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -e '.[test,benchmark]'
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Test
        run: python -m pytest

      - name: Install member-01 preprocessor
        working-directory: teams/member-01/page-preprocessor
        run: python -m pip install -e '.[dev]'
      - name: Test member-01 preprocessor
        working-directory: teams/member-01/page-preprocessor
        run: python -m pytest -q
